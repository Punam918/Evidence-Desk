[project]
name = "evidencedesk-workspace"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["evidencedesk"]

[tool.uv.workspace]
members = ["apps/api"]
[tool.uv.sources]
evidencedesk = { workspace = true }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio",
    "pytest-cov",
    "hypothesis",
    "ruff",
    "mypy",
    "types-PyYAML",
    "respx",
    "jsonschema",
    "openapi-spec-validator",
    "pglast",
    "pip-audit",
    "moto[s3]==5.2.3",
    "flask>=3.1,<4",
    "boto3-stubs[s3]>=1.43.111",
    "flask-cors>=6.0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: disposable real services", "models: downloads and executes pinned local model artifacts"]

[tool.ruff]
target-version = "py314"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
[tool.mypy]
python_version = "3.14"
strict = true
files = ["apps/api/src"]
