# Local portfolio deployment. Only HTTPS ingress is published on loopback.
# First start downloads pinned public model artifacts; no paid API key is required.
name: evidencedesk

x-runtime: &runtime
  image: evidencedesk-application:local
  build:
    context: .
    dockerfile: infra/application/Dockerfile.api
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  init: true
  pids_limit: 128
  mem_limit: 512m
  cpus: 1
  tmpfs: ["/tmp:uid=10001,gid=10001,mode=0700,size=96m"]
  healthcheck:
    disable: true
  logging: &logging
    driver: local
    options:
      max-size: 10m
      max-file: "3"

x-storage: &storage-env
  ED_S3_ENDPOINT: http://s3:8333
  ED_S3_REGION: us-east-1
  ED_S3_BUCKET: evidencedesk
  ED_S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
  ED_S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key

x-models: &model-env
  ED_MODEL_CACHE_PATH: /models
  ED_LOCAL_MODEL_URL: http://ollama:11434

services:
  bootstrap:
    <<: *runtime
    user: "0:0"
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    network_mode: none
    entrypoint: [python, -m, infra.bootstrap.initialize]
    volumes:
      - secrets:/secrets
      - models:/volumes/models
      - identity-data:/volumes/identity-data
      - objects:/volumes/objects
      - qdrant-data:/volumes/qdrant-data
      - qdrant-snapshots:/volumes/qdrant-snapshots
      - caddy-data:/volumes/caddy-data
      - caddy-config:/volumes/caddy-config

  postgres:
    image: postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: [postgres, -c, max_connections=100, -c, shared_buffers=128MB, -c, log_statement=none]
    volumes:
      - postgres:/var/lib/postgresql
      - type: volume
        source: secrets
        target: /run/secrets
        read_only: true
        volume: {subpath: postgres}
    networks: [backend]
    mem_limit: 768m
    cpus: 1
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, pg_isready, -h, "127.0.0.1", -U, postgres, -d, postgres]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    logging: *logging

  database-init:
    <<: *runtime
    networks: [backend]
    entrypoint: [python, -m, infra.bootstrap.database]
    volumes:
      - type: volume
        source: secrets
        target: /run/secrets
        read_only: true
        volume: {subpath: database-init}
    depends_on:
      postgres: {condition: service_healthy}

  identity:
    image: evidencedesk-identity:local
    build:
      context: .
      dockerfile: infra/application/Dockerfile.identity
    user: "10001:10001"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    environment:
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=25
    tmpfs: ["/tmp:uid=10001,gid=10001,mode=0700,size=128m"]
    volumes:
      - identity-data:/opt/keycloak/data
      - type: volume
        source: secrets
        target: /run/secrets
        read_only: true
        volume: {subpath: identity}
      - type: volume
        source: secrets
        target: /opt/keycloak/data/import
        read_only: true
        volume: {subpath: identity}
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; head -1 <&3 | grep -q 200'"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 20
    depends_on:
      database-init: {condition: service_completed_successfully}
    logging: *logging

  s3:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    user: "10001:10001"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
    entrypoint: [weed, -logtostderr=true, -config_dir=/run/secrets, server]
    command:
      - -dir=/data
      - -ip=127.0.0.1
      - -ip.bind=127.0.0.1
      - -filer
      - -s3
      - -s3.ip.bind=0.0.0.0
      - -s3.config=/run/secrets/s3.json
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -s3.iam.readOnly=true
      - -master.telemetry=false
      - -master.volumeSizeLimitMB=128
      - -volume.max=16
    tmpfs: ["/tmp:uid=10001,gid=10001,mode=0700,size=64m"]
    volumes:
      - objects:/data
      - type: volume
        source: secrets
        target: /run/secrets
        read_only: true
        volume: {subpath: storage}
    networks: [backend]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    logging: *logging

  storage-init:
    <<: *runtime
    networks: [backend]
    entrypoint: [python, -m, infra.bootstrap.storage]
    volumes:
      - type: volume
        source: secrets
        target: /run/secrets
        read_only: true
        volume: {subpath: storage-init}
    depends_on:
      s3: {condition: service_healthy}

  qdrant:
    image: qdrant/qdrant@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad
    user: "10001:10001"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [./qdrant, --config-path, /run/secrets/local.yaml]
    volumes:
      - qdrant-data:/qdrant/storage
      - qdrant-snapshots:/qdrant/snapshots
      - type: volume
        source: secrets
        target: /run/secrets
        read_only: true
        volume: {subpath: qdrant}
    tmpfs: ["/tmp:uid=10001,gid=10001,mode=0700,size=64m"]
    networks: [backend]
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
    healthcheck:
      test: [CMD-SHELL, "bash -c ': </dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    logging: *logging

  ollama:
    image: ollama/ollama@sha256:adca95a12c2b386a8f9a995e7fa0600e187e3323b5e5522f5a6c3b1ec73eff99
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NO_CLOUD: "1"
    volumes: [ollama:/root/.ollama]
    networks: [backend, downloads]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 9g
    memswap_limit: 9g
    cpus: 4
    pids_limit: 256
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 30
    logging: *logging

  models-init:
    <<: *runtime
    entrypoint: [python, -m, infra.bootstrap.models]
    command: [--download, --ollama-url, "http://ollama:11434"]
    environment:
      <<: *model-env
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
    mem_limit: 2g
    cpus: 2
    volumes: [models:/models]
    networks: [backend, downloads]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      ollama: {condition: service_healthy}

  parser:
    image: evidencedesk-parser-service:local
    build:
      context: .
      dockerfile: infra/parser/Dockerfile.service
    user: "0:0"
    restart: unless-stopped
    network_mode: none
    ipc: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    mem_limit: 1280m
    memswap_limit: 1280m
    cpus: 1
    pids_limit: 32
    tmpfs: ["/tmp:mode=0700,size=320m"]
    volumes: [parser-socket:/run/parser]
    logging: *logging

  web:
    image: evidencedesk-web:local
    build:
      context: .
      dockerfile: infra/application/Dockerfile.web
    user: "10001:10001"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [caddy, run, --config, /etc/caddy/Caddyfile.local, --adapter, caddyfile]
    ports: ["127.0.0.1:8443:8443"]
    networks:
      backend:
        aliases: [evidencedesk.localhost]
      ingress: {}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - type: volume
        source: secrets
        target: /run/tls
        read_only: true
        volume: {subpath: web}
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    depends_on:
      identity: {condition: service_healthy}
    logging: *logging

  api:
    <<: *runtime
    networks: [backend]
    restart: unless-stopped
    entrypoint: [python, -m, infra.bootstrap.entrypoint, --profile, api, --]
    command: [evidencedesk, api, --host, "0.0.0.0", --port, "8080"]
    environment:
      <<: [*storage-env, *model-env]
      ED_PUBLIC_ORIGIN: https://evidencedesk.localhost:8443
      ED_OIDC_ISSUER: https://evidencedesk.localhost:8443/identity/realms/evidencedesk
      ED_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      ED_SESSION_KEY_FILE: /run/secrets/session_key
      ED_CURSOR_KEY_FILE: /run/secrets/cursor_key
      ED_TLS_CA_FILE: /run/trust/ca.crt
    volumes:
      - models:/models:ro
      - type: volume
        source: secrets
        target: /run/secrets
        read_only: true
        volume: {subpath: api}
      - type: volume
        source: secrets
        target: /run/trust
        read_only: true
        volume: {subpath: trust}
    healthcheck:
      disable: false
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready',timeout=3).close()"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 15
    depends_on:
      database-init: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
      web: {condition: service_healthy}

  ingest:
    <<: *runtime
    networks: [backend]
    restart: unless-stopped
    entrypoint: [python, -m, infra.bootstrap.entrypoint, --profile, ingest, --]
    command: [evidencedesk, ingest-worker]
    environment:
      <<: [*storage-env, *model-env]
      ED_PARSER_SOCKET_PATH: /run/parser/parser.sock
      ED_PARSER_SERVICE_LOCK: infra/parser/service.lock.json
    mem_limit: 2g
    cpus: 2
    tmpfs: ["/tmp:uid=10001,gid=10001,mode=0700,size=320m"]
    volumes:
      - models:/models:ro
      - parser-socket:/run/parser:ro
      - type: volume
        source: secrets
        target: /run/secrets
        read_only: true
        volume: {subpath: ingest}
    depends_on:
      database-init: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
      models-init: {condition: service_completed_successfully}
      parser: {condition: service_healthy}

  index:
    <<: *runtime
    networks: [backend]
    restart: unless-stopped
    entrypoint: [python, -m, infra.bootstrap.entrypoint, --profile, index, --]
    command: [evidencedesk, index-worker]
    environment:
      <<: *storage-env
      ED_QDRANT_URL: http://qdrant:6333
      ED_QDRANT_WRITE_KEY_FILE: /run/secrets/qdrant_write_key
    volumes:
      - type: volume
        source: secrets
        target: /run/secrets
        read_only: true
        volume: {subpath: index}
    depends_on:
      database-init: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
      qdrant: {condition: service_healthy}

  chat:
    <<: *runtime
    networks: [backend]
    restart: unless-stopped
    entrypoint: [python, -m, infra.bootstrap.entrypoint, --profile, chat, --]
    command: [evidencedesk, chat-worker]
    environment:
      <<: *model-env
      ED_QDRANT_URL: http://qdrant:6333
      ED_QDRANT_READ_KEY_FILE: /run/secrets/qdrant_read_key
    mem_limit: 3g
    cpus: 2
    tmpfs: ["/tmp:uid=10001,gid=10001,mode=0700,size=256m"]
    volumes:
      - models:/models:ro
      - type: volume
        source: secrets
        target: /run/secrets
        read_only: true
        volume: {subpath: chat}
    depends_on:
      database-init: {condition: service_completed_successfully}
      models-init: {condition: service_completed_successfully}
      qdrant: {condition: service_healthy}

  brief:
    <<: *runtime
    networks: [backend]
    restart: unless-stopped
    entrypoint: [python, -m, infra.bootstrap.entrypoint, --profile, brief, --]
    command: [evidencedesk, brief-worker]
    volumes: &brief-volumes
      - type: volume
        source: secrets
        target: /run/secrets
        read_only: true
        volume: {subpath: brief}
    depends_on:
      database-init: {condition: service_completed_successfully}

  conversation-purge:
    <<: *runtime
    networks: [backend]
    restart: unless-stopped
    entrypoint: [python, -m, infra.bootstrap.entrypoint, --profile, brief, --]
    command: [evidencedesk, conversation-purge-worker]
    volumes: *brief-volumes
    depends_on:
      database-init: {condition: service_completed_successfully}

  model-health:
    <<: *runtime
    networks: [backend]
    restart: unless-stopped
    entrypoint: [python, -m, infra.bootstrap.entrypoint, --profile, probe, --]
    command: [python, -m, infra.bootstrap.probe_loop]
    environment: *model-env
    mem_limit: 1536m
    cpus: 2
    healthcheck:
      disable: false
      test: [CMD, python, -m, infra.bootstrap.probe_loop, --healthcheck]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    volumes:
      - models:/models:ro
      - type: volume
        source: secrets
        target: /run/secrets
        read_only: true
        volume: {subpath: probe}
    depends_on:
      database-init: {condition: service_completed_successfully}
      models-init: {condition: service_completed_successfully}

networks:
  backend:
    internal: true
  ingress: {}
  downloads: {}

volumes:
  secrets: {}
  postgres: {}
  identity-data: {}
  objects: {}
  qdrant-data: {}
  qdrant-snapshots: {}
  ollama: {}
  models: {}
  parser-socket: {}
  caddy-data: {}
  caddy-config: {}
