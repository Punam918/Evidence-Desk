[project]
name = "evidencedesk"
version = "0.1.0"
description = "Tenant-safe grounded knowledge workspace"
requires-python = ">=3.14,<3.15"
dependencies = [
 "fastapi>=0.143,<0.144", "uvicorn[standard]", "pydantic>=2.14,<3", "pydantic-settings",
 "sqlalchemy[asyncio]>=2.1,<2.2", "alembic>=1.20,<2", "psycopg[binary,pool]>=3.3,<4",
 "langgraph>=1.2.14,<1.3", "langgraph-checkpoint-postgres>=3.1.2,<4",
 "qdrant-client>=1.19.1,<1.20", "httpx>=0.28,<0.29", "openai>=3.28,<4", "httpx2>=2.1,<3",
 "authlib>=1.8,<2", "cryptography", "boto3", "PyYAML", "python-multipart",
 "pypdf>=6.20,<7", "python-docx", "beautifulsoup4", "defusedxml", "tiktoken", "jinja2>=3.1,<4", "tokenizers>=0.23,<0.24",
 "prometheus-client", "opentelemetry-sdk", "opentelemetry-exporter-otlp-proto-http",
]
[project.optional-dependencies]
inference = ["torch", "sentence-transformers>=6.1,<7", "fastembed>=0.9,<0.10"]
providers = ["anthropic", "google-genai"]
[project.scripts]
evidencedesk = "evidencedesk.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/evidencedesk"]
