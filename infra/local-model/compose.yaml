services:
  ollama:
    image: ollama/ollama@sha256:adca95a12c2b386a8f9a995e7fa0600e187e3323b5e5522f5a6c3b1ec73eff99
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NO_CLOUD: "1"
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - ../../.cache/ollama:/root/.ollama
    mem_limit: 9g
    memswap_limit: 9g
    cpus: 4
    restart: unless-stopped
    healthcheck:
      test: [CMD, ollama, list]
      interval: 30s
      timeout: 5s
      retries: 3
