global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
- /etc/prometheus/alerts.yml
scrape_configs:
- job_name: evidencedesk
  scrape_timeout: 3s
  sample_limit: 12000
  label_limit: 8
  body_size_limit: 2MB
  authorization:
    type: Bearer
    credentials_file: /run/secrets/metrics_token
  static_configs:
  - targets:
    - api:9108
    labels:
      service: api
  - targets:
    - chat-worker:9108
    labels:
      service: chat-worker
  - targets:
    - brief-worker:9108
    labels:
      service: brief-worker
  - targets:
    - ingest-worker:9108
    labels:
      service: ingest-worker
  - targets:
    - index-worker:9108
    labels:
      service: index-worker
  - targets:
    - metrics-worker:9108
    labels:
      service: metrics-worker
