spec_version: 2.0.0
limits:
  upload_bytes: 20971520
  workspace_bytes: 1073741824
  document_pages: 200
  document_chunks: 5000
  active_chunks_deployment: 100000
  chat_concurrency_global: 5
  chat_concurrency_workspace: 2
  query_chars: 2000
  query_embedding_tokens: 256
  query_generation_tokens: 512
ingestion:
  lease_seconds: 30
  heartbeat_seconds: 10
  attempts: 3
  parser_seconds: 60
  parser_memory_mib: 1024
  batch_size: 32
  allow_partial_coverage: false
retrieval:
  profile: hybrid_rerank
  dense_k: 40
  lexical_k: 40
  rrf_constant: 60
  rerank_k: 20
  final_k: 8
  evidence_tokens: 3072
  rerank_timeout_ms: 2000
  query_rewrite_enabled: false
  backend: qdrant
  lexical_encoder: fastembed_bm25
  max_authorized_revisions: 4096
generation:
  run_deadline_seconds: 60
  max_attempts: 3
  same_provider_retries: 1
  fallback_candidates: 1
  max_output_tokens: 1024
  history_tokens: 2048
  max_recent_turns: 6
  max_tool_calls: 3
budgets:
  per_run_usd: '0.05'
  workspace_daily_usd: '2.00'
  workspace_monthly_usd: '20.00'
  eval_run_usd: '10.00'
retention:
  events_hours: 24
  idempotency_hours: 24
  conversation_days: 90
  purge_hours: 24
  backup_days: 30
  approval_minutes: 10
features:
  ocr: false
  external_tools: false
  persistent_personal_memory: false
  summaries: false
  gpu_serving: false
workflow:
  engine: langgraph
  durability: sync
  recursion_limit: 16
  checkpoint_retention_hours: 24
  state_schema_version: 1
index:
  outbox_batch: 100
  reconcile_seconds: 60
  write_wait: true
  max_attempts: 3
