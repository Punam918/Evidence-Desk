openapi: 3.1.0
info:
  title: EvidenceDesk API
  version: 2.0.0
  description: Normative capstone design. Cookie sessions, CSRF on mutations, current workspace membership
    and object ownership. See docs/04-backend-and-apis/api-conventions.md. All model/benchmark capabilities
    remain subject to implementation gates.
servers:
- url: https://localhost:8443
paths:
