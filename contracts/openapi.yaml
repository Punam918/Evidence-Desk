      security: []
      x-authorization: public
      x-rate-limit: 120/min/user; mutations 30/min/user
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
              example:
                status: ok
        '400':
          description: invalid_request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://evidencedesk.invalid/problems/invalid_request
