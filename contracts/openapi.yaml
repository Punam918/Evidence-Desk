components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ed_session
  schemas:
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          maxLength: 120
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          maxLength: 80
        detail:
          type: string
          maxLength: 1000
        request_id: *id001
        retryable:
          type: boolean
      required:
      - type
      - title
      - status
      - code
      - detail
      - request_id
      - retryable
    User:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        email:
          type: string
          format: email
        display_name:
          type: string
          maxLength: 120
      required:
      - id
      - email
      - display_name
    Session:
      type: object
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/User'
        csrf_token:
          type: string
          maxLength: 128
        expires_at: &id002
          type: string
          format: date-time
      required:
      - user
      - csrf_token
      - expires_at
    WorkspaceInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
      required:
      - name
    Workspace:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        name:
          type: string
          maxLength: 120
        role:
          type: string
          enum:
          - viewer
          - editor
          - admin
          - owner
        created_at: *id002
        version:
          type: integer
          minimum: 1
      required:
      - id
      - name
      - role
      - created_at
      - version
    MemberInput:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - viewer
          - editor
          - admin
          - owner
      required:
      - email
      - role
    RoleInput:
      type: object
      additionalProperties: false
      properties:
        role:
          type: string
          enum:
          - viewer
          - editor
          - admin
          - owner
        expected_version:
          type: integer
          minimum: 1
      required:
      - role
      - expected_version
    Member:
      type: object
      additionalProperties: false
      properties:
        user_id: *id001
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - viewer
          - editor
          - admin
          - owner
        version:
          type: integer
          minimum: 1
      required:
      - user_id
      - email
      - role
      - version
    Settings:
      type: object
      additionalProperties: false
      properties:
        privacy_mode: &id003
          type: string
          enum:
          - hosted_allowed
          - local_only
        daily_budget_usd: &id004
          type: string
          pattern: ^\d+\.\d{2}$
        monthly_budget_usd: &id005
          type: string
          pattern: ^\d+\.\d{2}$
        retrieval_profile: &id006
          type: string
          enum:
          - dense
          - hybrid
          - hybrid_rerank
          - hybrid_rewrite
        top_k: &id007
          type: integer
          minimum: 1
          maximum: 8
        summaries_enabled: &id008
          type: boolean
        version:
          type: integer
          minimum: 1
      required:
      - privacy_mode
      - daily_budget_usd
      - monthly_budget_usd
      - retrieval_profile
      - top_k
      - summaries_enabled
      - version
    SettingsInput:
      type: object
      additionalProperties: false
      properties:
        privacy_mode: *id003
        daily_budget_usd: *id004
        monthly_budget_usd: *id005
        retrieval_profile: *id006
        top_k: *id007
        summaries_enabled: *id008
        expected_version:
          type: integer
          minimum: 1
      required:
      - privacy_mode
      - daily_budget_usd
      - monthly_budget_usd
      - retrieval_profile
      - top_k
      - summaries_enabled
      - expected_version
    KnowledgeBaseInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
      required:
      - name
    KnowledgeBase:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        workspace_id: *id001
        name:
          type: string
          maxLength: 120
        document_count:
          type: integer
          minimum: 0
        created_at: *id002
      required:
      - id
      - workspace_id
      - name
      - document_count
      - created_at
    JobRef:
      type: object
      additionalProperties: false
      properties:
        job_id: *id001
        status:
          type: string
          enum:
          - queued
          - running
          - retry_wait
          - succeeded
          - dead
          - cancelled
      required:
      - job_id
      - status
    Document:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        workspace_id: *id001
        kb_id: *id001
        title:
          type: string
          maxLength: 255
        active_revision_id: &id009
          type:
          - string
          - 'null'
          format: uuid
        latest_revision_id: *id001
        status:
          type: string
          maxLength: 40
        created_at: *id002
        version:
          type: integer
          minimum: 1
      required:
      - id
      - workspace_id
      - kb_id
      - title
      - active_revision_id
      - latest_revision_id
      - status
      - created_at
      - version
    UploadAccepted:
      type: object
      additionalProperties: false
      properties:
        document:
          $ref: '#/components/schemas/Document'
        revision_id: *id001
        job:
          $ref: '#/components/schemas/JobRef'
      required:
      - document
      - revision_id
      - job
    Revision:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        document_id: *id001
        revision_no:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - queued
          - validating
          - parsing
          - normalizing
          - chunking
          - embedding
          - verifying
          - published
          - superseded
          - retry_wait
          - failed
          - cancelled
          - deleting
          - deleted
        content_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        profile_id:
          type: string
          maxLength: 80
        chunk_count:
          type: integer
          minimum: 0
        warnings:
          type: array
          items:
            type: string
            maxLength: 300
          maxItems: 100
        created_at: *id002
      required:
      - id
      - document_id
      - revision_no
      - status
      - content_sha256
      - profile_id
      - chunk_count
      - warnings
      - created_at
    ReprocessInput:
      type: object
      additionalProperties: false
      properties:
        profile_id:
          type: string
          enum:
          - structure_v1
        expected_version:
          type: integer
          minimum: 1
      required:
      - profile_id
      - expected_version
    Job:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        kind:
          type: string
          enum:
          - ingest
          - chat
          - purge
          - summary
          - maintenance
          - workflow
        status:
          type: string
          enum:
          - queued
          - running
          - retry_wait
          - succeeded
          - dead
          - cancelled
        stage:
          type: string
          maxLength: 40
        attempts:
          type: integer
          minimum: 0
          maximum: 3
        progress:
          type: integer
          minimum: 0
          maximum: 100
        error_code:
          type:
          - string
          - 'null'
        updated_at: *id002
      required:
      - id
      - kind
      - status
      - stage
      - attempts
      - progress
      - error_code
      - updated_at
    ConversationInput:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
      required:
      - title
    Conversation:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        title:
          type: string
          maxLength: 120
        created_at: *id002
        updated_at: *id002
        version:
          type: integer
          minimum: 1
      required:
      - id
      - title
      - created_at
      - updated_at
      - version
    Sentence:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
        citation_ids:
          type: array
          items:
            type: string
            pattern: ^E[1-8]$
          maxItems: 8
          minItems: 1
      required:
      - text
      - citation_ids
    Answer:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - answered
          - abstained
        sentences:
          type: array
          items:
            $ref: '#/components/schemas/Sentence'
          maxItems: 40
        limitations:
          type: array
          items:
            type: string
            maxLength: 500
          maxItems: 10
      required:
      - status
      - sentences
      - limitations
      allOf:
      - if:
          properties:
            status:
              const: answered
        then:
          properties:
            sentences:
              minItems: 1
              type: array
      - if:
          properties:
            status:
              const: abstained
        then:
          properties:
            sentences:
              maxItems: 0
              type: array
            limitations:
              minItems: 1
              type: array
    Citation:
      type: object
      additionalProperties: false
      properties:
        evidence_id:
          type: string
          pattern: ^E[1-8]$
        chunk_id: *id001
        document_id: *id001
        revision_id: *id001
        title:
          type: string
          maxLength: 255
        page_start:
          type:
          - integer
          - 'null'
          minimum: 1
        heading_path:
          type: array
          items:
            type: string
            maxLength: 120
          maxItems: 20
        available:
          type: boolean
      required:
      - evidence_id
      - chunk_id
      - document_id
      - revision_id
      - title
      - page_start
      - heading_path
      - available
    Message:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        conversation_id: *id001
        sequence:
          type: integer
          minimum: 1
        role:
          type: string
          enum:
          - user
          - assistant
        state:
          type: string
          enum:
          - final
